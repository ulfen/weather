<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="weather-app">
  <section class="weather-card" aria-labelledby="weather-title">
    <header class="weather-header">
      <h1 id="weather-title">Weather</h1>
      <div class="location-search">
        <input type="text" id="location-input" placeholder="Enter city or location" />
        <button id="search-button">Search</button>
        <div class="search-error" id="search-error"></div>
      </div>
    </header>

    <p class="location" id="location"></p>

    <div class="current-weather" aria-live="polite">
      <div class="weather-icon" id="weather-icon" aria-label="Sunny weather">☀️</div>
      <p class="temperature" id="temperature"></p>
      <p class="condition" id="condition"></p>
    </div>

    <div class="temperature-range" id="temperature-range" aria-label="High and low temperatures"></div>

    <div class="forecast" aria-label="Seven-day forecast">
      <div class="forecast-row" id="forecast-row"></div>
    </div>
  </section>
</main>
<script src="app.js" defer></script>
</body>
</html>
