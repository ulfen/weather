<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather</title>
    <!-- Theme: Automatic based on system preference (prefers-color-scheme) -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="weather-app">
  <section class="weather-card" aria-label="Weather forecast">
    <header class="weather-header">
      <div class="header-main" id="header-main">
        <button type="button" class="location-btn" id="location-btn" aria-label="Toggle favorite locations" aria-expanded="false" aria-haspopup="true">
          <span class="location" id="location"></span>
          <span class="location-chevron" aria-hidden="true">▾</span>
        </button>
        <div class="header-actions">
          <div class="model-picker" aria-label="Weather model selector">
            <button type="button" class="model-picker-btn" id="model-picker-btn" aria-label="Select weather model" aria-expanded="false">
              <span class="model-picker-label">Model</span>
              <span class="model-picker-value" id="model-picker-value">Model Fusion</span>
              <span class="model-picker-chevron" aria-hidden="true">▾</span>
            </button>
            <div class="model-picker-menu hidden" id="model-picker-menu" role="menu" aria-label="Weather model options">
              <button type="button" class="model-option is-active" data-model="fusion" role="menuitemradio" aria-checked="true">Model Fusion</button>
              <button type="button" class="model-option" data-model="knmi_seamless" role="menuitemradio" aria-checked="false">KNMI</button>
              <button type="button" class="model-option" data-model="dwd_icon_seamless" role="menuitemradio" aria-checked="false">DWD</button>
              <button type="button" class="model-option" data-model="meteofrance_seamless" role="menuitemradio" aria-checked="false">Météo France</button>
              <button type="button" class="model-option" data-model="ukmo_seamless" role="menuitemradio" aria-checked="false">UKMO</button>
              <button type="button" class="model-option" data-model="ncep_gfs_seamless" role="menuitemradio" aria-checked="false">NCEP</button>
            </div>
          </div>
          <button type="button" class="icon-btn favorite-toggle-btn" id="favorite-toggle" aria-label="Add to favorites" aria-pressed="false">☆</button>
          <button type="button" class="icon-btn search-toggle-btn" id="search-toggle" aria-label="Search location" aria-expanded="false">🔍</button>
        </div>
      </div>

      <div class="favorites-menu hidden" id="favorites-menu" role="menu" aria-label="Favorite locations">
        <div class="current-location-section">
          <button type="button" class="current-location-btn" id="current-location-btn" aria-label="Use current physical GPS location">
            <span class="current-location-icon" aria-hidden="true">📍</span>
            <span class="current-location-label" id="current-location-label">Current Location</span>
          </button>
        </div>
        <div class="favorites-header">
          <span class="favorites-title">Saved Locations</span>
        </div>
        <div class="favorites-list" id="favorites-list"></div>
      </div>

      <form class="location-search hidden" id="location-form" role="search">
        <input type="text" id="location-input" placeholder="Search city or location..." autocomplete="off" />
        <button type="submit" class="search-submit-btn" id="search-button" aria-label="Submit search">🔍</button>
        <button type="button" class="search-close-btn" id="search-close" aria-label="Close search">✕</button>
        <div class="search-error" id="search-error"></div>
      </form>
    </header>

    <div class="current-weather" aria-live="polite">
      <div class="weather-icon" id="weather-icon" aria-label="Sunny weather">☀️</div>
      <p class="temperature" id="temperature"></p>
      <p class="condition" id="condition"></p>
    </div>

    <div class="weather-events" id="weather-events" aria-label="Notable weather events"></div>

    <div class="hourly-forecast" aria-label="Hourly forecast">
      <div class="hourly-row" id="hourly-row"></div>
    </div>

    <div class="forecast" aria-label="Seven-day forecast">
      <div class="forecast-row" id="forecast-row"></div>
    </div>

    <div class="attribution" aria-label="Attribution">
      <a href="https://open-meteo.com/">
        Weather data by Open-Meteo.com
      </a>
    </div>
  </section>
</main>
<script src="app.js" defer></script>
</body>
</html>
